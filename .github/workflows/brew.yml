name: Test homebrew bottles
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  brew:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - macos-26
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install Macaulay2
        run: |
          brew trust Macaulay2/tap
          brew tap Macaulay2/tap
          brew install macaulay2

      - name: Test Macaulay2 installation
        run: |
          M2 --check 1
          M2 --check 2
          M2 --check 3
